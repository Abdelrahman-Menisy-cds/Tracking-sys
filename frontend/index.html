<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F4F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)" />
    <!-- The brand mark in the tab. The SVG that used to be listed first is the
         app's drawn placeholder, and a browser takes the first icon it can
         use - so the tab showed that instead of the brand. The brand PNGs lead
         now, with /brand/mark-512.png as the touch/home-screen icon. Every path
         here is verified to resolve in the built output. -->
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/mark-512.png" />
    <title>هي فوضى؟ — شؤون الموظفين (عرض تجريبي)</title>
    <script>
      (() => {
        try {
          const locale = localStorage.getItem("tracking-sys.locale");
          const appearance = localStorage.getItem("tracking-sys.appearance");
          if (locale === "ar" || locale === "en") {
            document.documentElement.lang = locale;
            document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
          }
          // Light on a first visit: with nothing stored the OS theme used to
          // decide, which handed a new visitor a dark app they never chose.
          const resolved = appearance === "light" || appearance === "dark"
            ? appearance
            : "light";
          document.documentElement.dataset.theme = resolved;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="هي فوضى؟ — نظام طلبات وسجلات وقت الموظفين. نسخة عرض تجريبية ببيانات وهمية." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
