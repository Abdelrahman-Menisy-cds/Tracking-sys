<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>هي فوضى؟ — شؤون الموظفين (عرض تجريبي)</title>
    <script>
      (() => {
        try {
          const locale = localStorage.getItem("tracking-sys.locale");
          const appearance = localStorage.getItem("tracking-sys.appearance");
          if (locale === "ar" || locale === "en") {
            document.documentElement.lang = locale;
            document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
          }
          const resolved = appearance === "light" || appearance === "dark"
            ? appearance
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = resolved;
        } catch {
          document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <meta name="description" content="هي فوضى؟ — نظام طلبات وسجلات وقت الموظفين. نسخة عرض تجريبية ببيانات وهمية." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
